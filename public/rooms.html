<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rooms | Hotel Management</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
  <div class="container">
    <a class="navbar-brand" href="rooms.html">Hotel Management</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="register.html">Register</a></li>
        <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
        <li class="nav-item"><a class="nav-link" href="rooms.html">Rooms</a></li>
        <li class="nav-item"><a class="nav-link" href="mybookings.html">My Bookings</a></li>
        <li class="nav-item"><a class="nav-link" href="#" id="logoutBtn">Logout</a></li>
      </ul>
    </div>
  </div>
</nav>

<script>
  // Logout functionality
  const logoutBtn = document.getElementById("logoutBtn");
  if (logoutBtn) {
    logoutBtn.addEventListener("click", () => {
      localStorage.removeItem("customerId"); // clear login info
      alert("Logged out successfully!");
      window.location.href = "/login.html"; // redirect to login
    });
  }

  // Hide logout if user is not logged in
  if (!localStorage.getItem("customerId")) {
    logoutBtn.style.display = "none";
  }

  // Highlight active page in navbar
  const links = document.querySelectorAll('.nav-link');
  links.forEach(link => {
    if (link.href === window.location.href) {
      link.classList.add('active');
    }
  });

</script>

    <div class="container my-5">
        <h2 class="text-center mb-4">Available Rooms</h2>
        <div class="row" id="roomsContainer">
            <!-- Room cards will be injected here using JS -->
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
async function loadRooms() {
    try {
        const res = await fetch("/api/rooms");
        const rooms = await res.json();
        const container = document.getElementById("roomsContainer");

        rooms.forEach(r => {
            const card = document.createElement("div");
            card.classList.add("col-md-4", "mb-3");
            card.innerHTML = `
                <div class="card h-100 shadow">
                    <div class="card-body">
                        <h5 class="card-title">${r.roomType}</h5>
                        <p class="card-text">Rate: ₹${r.rate}</p>
                        <p class="card-text">Available: ${r.quantity}</p>
                        <a href="/booking.html?roomId=${r._id}" class="btn btn-primary w-100">Book Now</a>
                    </div>
                </div>
            `;
            container.appendChild(card);
        });
    } catch (err) {
        console.error(err);
    }
}

loadRooms();
</script>


</body>
</html>
